[workspace]
name = "lion-guardians"
channels = [
    # Uncomment the following lines to use local channels for development.
    # "file:///tmp/ecoscope-workflows/release/artifacts/",
    "file:///tmp/ecoscope-workflows-custom/release/artifacts/",
    'https://repo.prefix.dev/ecoscope-workflows/',
    'conda-forge',
    'https://repo.prefix.dev/ecoscope-workflows-custom/',
]
platforms = ['linux-64', 'osx-arm64', 'win-64']

[dependencies]
curl = "*"
rattler-build = "*"
yq = "*"
hatch = "*"
pip = "*"
hatch-vcs = "*"
playwright = ">=1.58.2,<2"
wt-compiler = "==0.8.0"
graphviz = "*"

[feature.compile.dependencies]
ecoscope-workflows-ext-lion-guardians = "*"

ecoscope-workflows-ext-ste = "0.0.0rc1.*"
ecoscope-workflows-ext-custom = "0.1.0rc14.*"
graphviz = "*"
wt-compiler = "==0.8.0"

[environments]
compile = { features = [
    "compile",
], solve-group = "compile", no-default-feature = true }

[tasks]
[tasks.build-release]
cmd = './publish/build.sh'

[tasks.pytest-310]
cmd = './dev/pytest-task.sh 310'

[tasks.pytest-311]
cmd = './dev/pytest-task.sh 311'

[tasks.pytest-312]
cmd = './dev/pytest-task.sh 312'

[feature.compile.tasks.compile-collared_lions]
cmd = './dev/recompile.sh collared_lions --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-collared_lions]
cmd = './dev/recompile.sh collared_lions --update'
depends-on = ["build-release"]

[feature.compile.tasks.compile-guardians_report]
cmd = './dev/recompile.sh guardians_report --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-guardians_report]
cmd = './dev/recompile.sh guardians_report --update'
depends-on = ["build-release"]


[feature.compile.tasks.compile-vehicles_report]
cmd = './dev/recompile.sh vehicles_report --install'
depends-on = ["build-release"]

[feature.compile.tasks.recompile-vehicles_report]
cmd = './dev/recompile.sh vehicles_report --update'
depends-on = ["build-release"]
