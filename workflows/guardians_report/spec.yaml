id: guardians_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-lion-guardians
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge
rjsf-overrides: {}
task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # Set workflow details
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time range
    id: time_range
    task: set_time_range

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Set groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []

  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  # Set base maps
  - name: Base Maps
    id: base_map_defs
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20
        - url: >-
            https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
          opacity: 0.15
          max_zoom: 20

  # Download amboseli group ranches and the collared lions templates
  - name: Area of Interest from ER 
    id: select_geo_er 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.get_spatial_features
    partial:
      client: ${{ workflow.er_client_name.return }}
      layers:
        - query:
            feature_type: "Conservancies"
          style:
            - polygon:
                - fill_color: ["#8fbc8b"] #"#3388FF"
                  stroke_color: "#8fbc8b"
                  fill_opacity: 0.75
                  stroke_width: 1.75
          group_by: "type_name"
          legend_title: "Map Layers"

        - query:
            feature_type: "Group Ranch Boundaries"
          style:
            - polygon:
                - fill_opacity: 0
                  stroke_color: "#000000"
                  stroke_width: 1.25

          group_by: "type_name"
          legend_title: ""

        # - query:
        #     featureset_name: "Boundaries"
        #   style: []
        #   group_by: "type_name"
        #   legend_title: "Boundaries"

  - name: Build Study Area Map Layer
    id: spatial_features_layer
    task: ecoscope_workflows_ext_ste.tasks.results.create_spatial_features_layer
    partial:
      geodataframes: ${{ workflow.select_geo_er.return }}

  - name: Download guardians report cover page
    id: persist_cover_page
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/p1xk9no77w9ctpc4mnn6p/patrol_guardians_cover_page.docx?rlkey=tc5oo54s29wu7cz47glvlbcaj&st=rtwbfa0i&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Download guardians report  subject page
    id: persist_indv_subject_page
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/kp9mkc9dd5qbast86ufk4/custom_patrol_template.docx?rlkey=ea12bxesuu9dnnj1ngfahhqvr&st=w7q7uf3l&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  # Retrieve done and only routine patrols
  - name: Set patrol and patrol events params
    id: er_patrol_and_events_params
    task: set_patrols_and_patrol_events_params
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types: []
      status: ["done"]
      include_null_geometry: false
      include_patrol_details: true
      raise_on_empty: false
      truncate_to_time_range: true
      sub_page_size: 200
      patrols_overlap_daterange: false
      patrol_types: ["routine_patrol"]

  - name: Prefetch patrols
    id: prefetch_patrols
    task: get_patrols_from_combined_params
    partial:
      combined_params: ${{ workflow.er_patrol_and_events_params.return }}

  - name: Get patrol observations
    id: patrol_obs
    task: get_patrol_observations_from_patrols_df_and_combined_params
    partial:
      patrols_df: ${{ workflow.prefetch_patrols.return }}
      combined_params: ${{ workflow.er_patrol_and_events_params.return }}

  - name: Get patrol events
    id: patrol_events
    task: unpack_events_from_patrols_df_and_combined_params
    partial:
      patrols_df: ${{ workflow.prefetch_patrols.return }}
      combined_params: ${{ workflow.er_patrol_and_events_params.return }}

  - name: Get event type display names from events
    id: event_type_display_names
    task: get_event_type_display_names_from_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      events_gdf: ${{ workflow.patrol_events.return }}
      append_category_names: duplicates

  - name: Convert patrols to timezone
    id: convert_patrols_to_user_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.patrol_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - patrol_start_time
        - patrol_end_time
        - fixtime

  - name: Convert events to timezone
    id: convert_events_to_user_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.event_type_display_names.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - time
        - patrol_start_time

  - name: Persist events as geoparquet
    id: persist_events_geoparquet
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
      df: ${{ workflow.convert_events_to_user_timezone.return }}
      filename: events

  - name: Transform Observations to Relocations
    id: patrol_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.convert_patrols_to_user_timezone.return }}
      relocs_columns:
        - patrol_id
        - patrol_start_time
        - patrol_end_time
        - patrol_type__value
        - patrol_type__display
        - patrol_serial_number
        - patrol_status
        - patrol_subject
        - groupby_col
        - fixtime
        - junk_status
        - extra__source
        - geometry
      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Exclude nightime patrols
    id: filter_daytime_patrol
    task: ecoscope_workflows_ext_lion_guardians.tasks.io.filter_daytime_patrols
    partial:
      start_hour: 6
      end_hour: 19
      df: ${{ workflow.patrol_reloc.return }}

  # restrict to only foot patrols for now
  - name: Trajectory segment filter
    id: patrol_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.filter_daytime_patrol.return }}
      trajectory_segment_filter: 
        min_length_meters: 10
        max_length_meters: 100000
        min_time_secs: 10
        max_time_secs: 21600
        min_speed_kmhr: 1
        max_speed_kmhr: 7 

  - name: Add temporal index to patrol trajectories
    id: traj_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.patrol_traj.return }}
      time_col: extra__patrol_start_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Rename value grouper columns for Trajectories
    id: traj_rename_grouper_columns
    task: map_columns
    partial:
      raise_if_not_found: true
      df: ${{ workflow.traj_add_temporal_index.return }}
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__patrol_type__value: patrol_type
        extra__patrol_serial_number: patrol_serial_number
        extra__patrol_status: patrol_status
        extra__patrol_subject: patrol_subject

  - name: Persist trajectories as geoparquet
    id: persist_patrols_geoparquet
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
      df: ${{ workflow.traj_rename_grouper_columns.return }}
      filename: trajectories

  # Retain only ambo related events
  - name: Filter patrol events
    id: filter_patrol_events
    task: apply_reloc_coord_filter
    partial:
      df: ${{ workflow.convert_events_to_user_timezone.return }}
      roi_gdf: null
      roi_name: null
      reset_index: true 
      filter_point_coords: null 
      bounding_box: 
        min_y: -2.8975255
        max_y: -2.19024722
        min_x: 36.90394594
        max_x: 37.87889203

    #36.90394594, -2.8975255 , 37.87889203, -2.19024722

  - name: Add temporal index to patrol events
    id: pe_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.filter_patrol_events.return }}
      time_col: patrol_start_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Patrol Events Colormap
    id: pe_colormap
    task: apply_color_map
    partial:
      df: ${{ workflow.pe_add_temporal_index.return }}
      input_column_name: event_type
      colormap: Accent
      output_column_name: event_type_colormap

  - name: Cast Patrol Trajectory Columns
    id: patrol_traj_cols_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.traj_rename_grouper_columns.return }} 
      columns:
        - patrol_serial_number
        - patrol_type

  - name: Cast Patrol Events Columns
    id: pe_cols_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.pe_colormap.return }}
      columns:
        - patrol_serial_number
        - patrol_type

  - name: Set Event Map Title
    id: set_event_map_title
    task: set_string_var
    partial:
      var: Patrol Events Map

  - name: Set Combined Trajectory & Event Map Title
    id: set_traj_map_title
    task: set_string_var
    partial:
      var: Trajectories Map

  - name: Set Time Density Map Title
    id: set_ltd_map_title
    task: set_string_var
    partial:
      var: Time Density Map

  - name: Set Bar Chart Title
    id: set_bar_chart_title
    task: set_string_var
    partial:
      var: Patrol Events Bar Chart

  - name: Set Pie Chart Title
    id: set_pie_chart_title
    task: set_string_var
    partial:
      var: Patrol Events Pie Chart

  - name: Split Patrol Trajectories by Group
    id: split_patrol_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.patrol_traj_cols_to_string.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Split Patrol Events by Group
    id: split_pe_groups
    task: split_groups
    partial:
      df: ${{ workflow.pe_cols_to_string.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Rename patrol events columns for map tooltip display
    id: pe_rename_display_columns
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns: []
      rename_columns:
        patrol_serial_number: Patrol Serial
        serial_number: Event Serial
        event_type_display: Event Type
        time: Event Time
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_pe_groups.return }}

  - name: Create map layers for each Patrols Events group
    id: patrol_events_map_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      data_url: null
      layer_style:
        get_fill_color: event_type_colormap
        get_line_color: [0, 0, 0, 200]
        get_radius: 2.50
        opacity: 0.75
        stroked: true
      legend:
        title: Events recorded
        label_column: Event Type
        color_column: event_type_colormap
        sort: ascending
        label_suffix: null

    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.pe_rename_display_columns.return }}

  - name: Combine styled layers with events
    id: merge_static_wevent_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.spatial_features_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.patrol_events_map_layers.return }}

  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope 
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf       
        mapvalues: 
          argnames: gdf 
          argvalues: ${{ workflow.pe_rename_display_columns.return }}
  
      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
        mapvalues:
          argnames: gdf
          argvalues: ${{ workflow.zoom_to_envelope.return }}

  - name: Combine event layers with view state
    id: zip_events_with_viewstate
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.merge_static_wevent_layers.return }}
        - ${{ workflow.gdf_image_extent.return }}

  - name: Draw events map
    id: draw_events
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      max_zoom: 10
      widget_id: ${{ workflow.set_event_map_title.return }}
      legend_style:
        placement: bottom-right
    mapvalues:
      argnames:
        - geo_layers
        - view_state
      argvalues: ${{ workflow.zip_events_with_viewstate.return }}

  - name: Persist events html
    id: persist_events_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: events
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.draw_events.return }}

  - name: Convert events html to png
    id: generate_events_png
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1

    mapvalues:
      argnames: html_path
      argvalues: ${{ workflow.persist_events_html.return }}

  # trajectory maps
  - name: Format speed values for display
    id: speed_val_with_unit
    task: map_values_with_unit
    partial:
      input_column_name: speed_kmhr
      output_column_name: speed_kmhr
      original_unit: km/h
      new_unit: km/h
      decimal_places: 1
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_patrol_traj_groups.return }}

  - name: Rename patrol traj columns for map tooltip display
    id: patrol_traj_rename_columns
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns:
        - speed_kmhr
        - geometry
        - timespan_seconds
        - segment_start
        - extra__patrol_type__display
        - patrol_serial_number
        - patrol_type
        - patrol_status
        - patrol_subject

      rename_columns:
        patrol_serial_number: Patrol Serial
        extra__patrol_type__display: Patrol Type
        segment_start: Start
        timespan_seconds: Duration (s)
        speed_kmhr: Speed (kph)
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.speed_val_with_unit.return }}

  - name: Create map layer for each Patrol Trajectories group
    id: patrol_traj_map_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      data_url: null
      layer_style:
        get_color: [0, 139, 139]
        get_width: 2.25
        width_scale: 1
        width_min_pixels: 2
        width_max_pixels: 8
        width_units: pixels
        cap_rounded: true
        joint_rounded: true
        billboard: false
        opacity: 0.45
        stroked: true

      legend:
        title: "Patrols"
        values: 
          - label: Foot patrols 
            color: "#008b8b"

    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.patrol_traj_rename_columns.return }}

  - name: Combine styled layers with trajectories
    id: merge_static_traj_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.spatial_features_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.patrol_traj_map_layers.return }}

  - name: Combine trajectory layers with view state
    id: zip_trajs_with_viewstate
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.merge_static_traj_layers.return }}
        - ${{ workflow.gdf_image_extent.return }}

  - name: Draw Ecomaps for each combined Trajectory and Patrol Events group
    id: trajs_ecomap
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      legend_style:
        placement: bottom-right
      static: false
      title: null
      max_zoom: 10
      widget_id: ${{ workflow.set_traj_map_title.return }}
    mapvalues:
      argnames:
        - geo_layers
        - view_state
      argvalues: ${{ workflow.zip_trajs_with_viewstate.return }}

  - name: Persist patrol trajectories as text
    id: traj_ecomap_html_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: patrol_trajectories
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.trajs_ecomap.return }}

  - name: Convert trajs html to png
    id: generate_trajs_png
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1

    mapvalues:
      argnames: html_path
      argvalues: ${{ workflow.traj_ecomap_html_urls.return }}

  - name: Create Map Widgets for patrol events
    id: events_map_widgets_single_views
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.set_event_map_title.return }}
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.persist_events_html.return }}

  - name: Merge events ecomap widgets
    id: events_grouped_map_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.events_map_widgets_single_views.return }}

  - name: Create Map Widgets for patrol trajectories
    id: trajs_map_widgets_single_views
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.set_traj_map_title.return }}
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.traj_ecomap_html_urls.return }}

  - name: Merge trajectories ecomap widgets
    id: trajs_grouped_map_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.trajs_map_widgets_single_views.return }}

  - name: Patrol summary statistics
    id: total_patrols
    task: dataframe_column_nunique
    partial:
      column_name: extra__patrol_id
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_patrol_traj_groups.return }}

  - name: Create Single Value Widgets for Total Patrols Per Group
    id: total_patrols_sv_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Total Patrols
      decimal_places: 1
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.total_patrols.return }}

  - name: Merge per group Total Patrols SV widgets
    id: total_patrols_grouped_sv_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_patrols_sv_widgets.return }}

  - name: Calculate Total Patrol Time Per Group
    id: total_patrol_time
    task: dataframe_column_sum
    partial:
      column_name: timespan_seconds
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_patrol_traj_groups.return }}

  - name: Convert total patrol time units
    id: total_patrol_time_converted
    task: with_unit
    partial:
      original_unit: s
      new_unit: h
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.total_patrol_time.return }}

  - name: Create Single Value Widgets for Total Patrol Time Per Group
    id: total_patrol_time_sv_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Total Time
      decimal_places: 1
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.total_patrol_time_converted.return }}

  - name: Merge per group Total Patrol Time SV widgets
    id: patrol_time_grouped_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_patrol_time_sv_widgets.return }}

  - name: Calculate Total Distance Per Group
    id: total_patrol_dist
    task: dataframe_column_sum
    partial:
      column_name: dist_meters
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_patrol_traj_groups.return }}

  - name: Convert total patrol distance units
    id: total_patrol_dist_converted
    task: with_unit
    partial:
      original_unit: m
      new_unit: km
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.total_patrol_dist.return }}

  - name: Create Single Value Widgets for Total Distance Per Group
    id: total_patrol_dist_sv_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Total Distance
      decimal_places: 1
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.total_patrol_dist_converted.return }}

  - name: Merge per group Total Patrol Distance SV widgets
    id: patrol_dist_grouped_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_patrol_dist_sv_widgets.return }}

  - name: Calculate Average Speed Per Group
    id: avg_speed
    task: dataframe_column_mean
    partial:
      column_name: speed_kmhr
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_patrol_traj_groups.return }}

  - name: Convert Average Speed units
