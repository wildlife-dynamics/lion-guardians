id: vehicles_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-lion-guardians
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge
    
rjsf-overrides:
  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped
      

workflow:
  #Set workflow details
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  #Timerange and timezone
  - name: Define time range
    id: time_range
    task: set_time_range

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  #Set groupers
  - name: Configure grouping strategy 
    id: groupers 
    task: set_groupers
    partial: 
      groupers:
        - index_name: subject_name

  #connect to ER 
  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection
    
  # Set base maps
  - name: Base Maps
    id: base_map_defs
    task: set_base_maps_pydeck
    partial: 
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 15
        - url: >-
            https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
          opacity: 0.15
          max_zoom: 15

  - name: Area of Interest from ER 
    id: select_geo_er 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.get_spatial_features
    partial:
      client: ${{ workflow.er_client_name.return }}
      layers:
        - query:
            feature_type: "Conservancies"
          style:
            - polygon:
                - fill_color: ["#8fbc8b"] #"#3388FF"
                  stroke_color: "#8fbc8b"
                  fill_opacity: 0.75
                  stroke_width: 1.75
          group_by: "type_name"
          legend_title: "Map Layers"

        - query:
            feature_type: "Group Ranch Boundaries"
          style:
            - polygon:
                - fill_opacity: 0
                  stroke_color: "#000000"
                  stroke_width: 1.25

          group_by: "type_name"
          legend_title: ""

        # - query:
        #     featureset_name: "Boundaries"
        #   style: []
        #   group_by: "type_name"
        #   legend_title: "Boundaries"

  - name: Build Study Area Map Layer
    id: spatial_features_layer
    task: ecoscope_workflows_ext_ste.tasks.results.create_spatial_features_layer
    partial:
      geodataframes: ${{ workflow.select_geo_er.return }}

  #Get subject group observations
  - name: Get Subject Group observations from EarthRanger
    id: subject_obs
    task: get_subjectgroup_observations
    partial:
      subject_group_name: Vehicles
      filter: clean
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      raise_on_empty: false
      include_details: false
      include_subjectsource_details: false
  
  - name: Convert relocs to timezone
    id: convert_relocs_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.subject_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  #Process relocations 
  - name: Transform observations to relocations
    id: subject_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.convert_relocs_timezone.return }}
      relocs_columns:
        - groupby_col
        - fixtime
        - junk_status
        - geometry
        - extra__subject__name
        - extra__subject__subject_subtype
        - extra__subject__sex
      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Persist relocations 
    id: persist_relocs
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet 
      filename: vehicle_relocations
      df: ${{ workflow.subject_reloc.return }}

  # Convert Relocs to Trajectories
  - name: Transform relocations to trajectories
    id: subject_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.subject_reloc.return }}
      trajectory_segment_filter:
        min_length_meters: 3 
        max_length_meters: 100000
        min_time_secs: 1
        max_time_secs: 21600
        min_speed_kmhr: 3
        max_speed_kmhr: 150
        
  - name: Persist trajectories 
    id: persist_trajs
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet 
      filename: vehicle_trajectories
      df: ${{ workflow.subject_traj.return }}

  # Add temporal index
  - name: Add temporal index to Subject Trajectories
    id: traj_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.subject_traj.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Classify trajectories by speed 
    id: classify_trajectories_speed_bins 
    task: apply_classification 
    partial: 
      df: ${{ workflow.traj_add_temporal_index.return }}
      input_column_name: speed_kmhr
      output_column_name: speed_bins
      classification_options: 
        scheme: equal_interval 
        k: 6 
      label_options: 
        label_range: false 
        label_decimals: 1 

  - name: Rename trajectory columnns
    id: rename_traj_cols
    task: map_columns
    partial:
      raise_if_not_found: true
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__name: subject_name
        extra__sex: subject_sex
        extra__subject_subtype: subject_subtype

      df: ${{ workflow.classify_trajectories_speed_bins.return }}

  # Split subjects trajectories by group
  - name: Split subject trajectories by group
    id: split_subject_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.rename_traj_cols.return }}
      groupers: ${{ workflow.groupers.return }}

  # generate speedmap 
  - name: Sort trajectories by speed bins 
    id: sort_trajs_by_speed 
    task: sort_values
    partial: 
      column_name: speed_bins 
      na_position: first 
      ascending: true 
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_subject_traj_groups.return }}

  - name: Apply colormap to speed bins 
    id: apply_speed_colormap 
    task: apply_color_map 
    partial: 
      input_column_name: speed_bins
      output_column_name: speed_bins_colormap 
      colormap: 
        - '#1a9850'
        - '#91cf60'
        - '#d9ef8b'
        - '#fee08b'
        - '#fc8d59'
        - '#d73027'
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.sort_trajs_by_speed.return }}
    
  - name: Format speed bins for legend 
    id: format_speed_bin_labels 
    task: map_values_with_unit 
    partial: 
      input_column_name: speed_bins 
      output_column_name: speed_bins_formatted 
      original_unit: km/h
      new_unit: km/h
      decimal_places: 1 
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.apply_speed_colormap.return }}  

  - name: Format speed values for display 
    id: format_speed_values 
    task: map_values_with_unit
    partial: 
      input_column_name: speed_kmhr 
      output_column_name: speed_kmhr 
      original_unit: km/h
      new_unit: km/h
      decimal_places: 1
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.format_speed_bin_labels.return }}
  
  - name: Exclude unnecessary columns from speedmap gdf 
    id: filter_speed_cols 
    task: subset_columns
    partial: 
      columns: 
        - dist_meters
        - speed_bins_colormap
        - geometry
        - speed_kmhr
        - speed_bins_formatted
      exclude: null 
      strict: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.format_speed_values.return }}

  - name: Generate speedmap layers 
    id: generate_speedmap_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    partial: 
      data_url: null
      layer_style:
        get_color: speed_bins_colormap
        get_width: 2.25
        width_scale: 1 
        width_min_pixels: 2 
        width_max_pixels: 8 
        width_units: pixels
        cap_rounded: true 
        joint_rounded: true
        billboard: false
        opacity: 0.45
        stroked: true 
      legend:
        title: Speed (km/h)
        label_column: speed_bins_formatted
        color_column: speed_bins_colormap
        sort: ascending 
        label_suffix: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.filter_speed_cols.return }}
  
  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope 
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf       
        mapvalues: 
          argnames: gdf 
          argvalues: ${{ workflow.filter_speed_cols.return }}
  
      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
        mapvalues:
          argnames: gdf
          argvalues: ${{ workflow.zoom_to_envelope.return }}

  - name: Combine ldx layers and speedmap layers 
    id: combined_ldx_speed_layers 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.spatial_features_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.generate_speedmap_layers.return }}

  - name: Combine speed layers with view state
    id: zip_speed_with_viewstate
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combined_ldx_speed_layers.return }}
        - ${{ workflow.gdf_image_extent.return }}
    
  - name: Draw speedmap 
    id: draw_speedmap
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map 
    partial: 
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null 
      max_zoom: 10
      legend_style: 
        placement: bottom-right
    mapvalues:
      argnames: 
        - geo_layers 
        - view_state
      argvalues: ${{ workflow.zip_speed_with_viewstate.return }}

  - name: Persist speedmap html 
    id: persist_speedmap_html
    task: persist_text 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: speedmap 
    mapvalues:
      argnames: text 
      argvalues: ${{ workflow.draw_speedmap.return }}
    
  - name: Create speedmap widgets 
    id: create_speedmap_widgets 
    task: create_map_widget_single_view 
    partial: 
      title: Speed Map 
    map: 
      argnames: 
        - view 
        - data 
      argvalues: ${{ workflow.persist_speedmap_html.return }}

  - name: Merge speedmap widgets 
    id: merge_speedmap_widgets 
    task: merge_widget_views 
    partial: 
      widgets: ${{ workflow.create_speedmap_widgets.return }}
    
  # 2. Generate tracks map
  - name: Generate track layers 
    id: generate_track_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer 
    partial: 
      data_url: null
      layer_style:
        get_color: [0, 0, 255]
        get_width: 2.25
        width_scale: 1 
        width_min_pixels: 2 
        width_max_pixels: 8 
        width_units: pixels
        cap_rounded: true 
        joint_rounded: true
        billboard: false
        opacity: 0.45
        stroked: true 
      legend:
        title: Vehicle Tracks
        values: 
          - label: Tracks 
            color: "#0000ff"
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.split_subject_traj_groups.return }} 

    # Combine layers ie static and grouped
  - name: Combine track layers and overlay layers
    id: combine_track_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: ${{ workflow.spatial_features_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.generate_track_layers.return }}

  - name: Zip layers and viewstate
    id: zip_track_layers_view
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combine_track_layers.return }}
        - ${{ workflow.gdf_image_extent.return }}

  - name: Draw track map
    id: draw_track_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      max_zoom: 15
      legend_style:
        placement: "bottom-right"
    mapvalues:
      argnames:
        - geo_layers
        - view_state
      argvalues: ${{ workflow.zip_track_layers_view.return }}

  - name: Persist tracks as text
    id: track_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: tracks
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.draw_track_map.return }}

  - name: Create tracks widgets 
    id: create_tracks_widgets 
    task: create_map_widget_single_view 
    partial: 
      title:  Vehicle Tracks
    map: 
      argnames: 
        - view 
        - data 
      argvalues: ${{ workflow.track_html_url.return }}

  - name: Merge tracks widgets 
    id: merge_tracks_widgets 
    task: merge_widget_views 
    partial: 
      widgets: ${{ workflow.create_tracks_widgets.return }}

  # 3. Draw line chart 
  - name: Draw vehicle line chart 
    id: draw_speed_line_chart 
    task: draw_line_chart 
    partial: 
      smoothing: null
      x_column: segment_start
      y_column: speed_kmhr
      category_column: null 
      line_kwargs:
        shape: "linear"
      layout_kwargs:
        title: null
        title_x: 0.01
        title_y:  0.95
        showlegend: false
        fontsize: 20
        fontcolor: "#2c3e50"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Date"
          showgrid: true
          gridcolor: "#e0e0e0"
          gridwidth: 1
          tickformat: "%Y-%m-%d"
          tickangle: -45
          rangemode: auto
        yaxis:
          title: "Speed (km/h)"
          tickformat: ".1f"
        legend_title: null
        hovermode: "x unified"
    mapvalues: 
      argnames: dataframe
      argvalues: ${{ workflow.split_subject_traj_groups.return }}

  - name: Persist line chart as text
    id: persist_vehicle_chart
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: speed_line_chart 
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.draw_speed_line_chart.return }}
  
  - name: Create Plot Widget for Line Chart
    id: line_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Vehicle Speed Over Time
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.persist_vehicle_chart.return }}

  - name: Merge Plot Widget Views
    id: grouped_plot_widget_merge
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.line_chart_widget.return }}

  # Metric summary widgets 
  - name: Generate summary table metrics for subjects
    id: summary_table
    task: summarize_df
    partial:
      groupby_cols:
        - subject_name
      summary_params: 
        - display_name: mean_speed
          aggregator: mean
          column: speed_kmhr
          decimal_places: 2

        - display_name: min_speed
          aggregator: min
          column: speed_kmhr
          decimal_places: 2

        - display_name: max_speed
          aggregator: max
          column: speed_kmhr
          decimal_places: 2
        
        - display_name: total_distance
          aggregator: sum 
          column: dist_meters
          original_unit: m
          new_unit: km
          decimal_places: 2

      reset_index: true 
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_subject_traj_groups.return }}

  - name: Persist summary table
    id: persist_summary_table
    task: persist_df 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: null
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.summary_table.return }}

  - name: Calculate mean speed 
    id: calc_mean_speed
    task: dataframe_column_sum
    partial:
      column_name: mean_speed
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.summary_table.return }}

  - name: Round off mean speed to 2 decimal_places
    id: round_mean_speed
    task: round_off_values
    partial:
      dp: 2
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.calc_mean_speed.return }}

  - name: Calculate min speed 
    id: calc_min_speed
    task: dataframe_column_sum
    partial:
      column_name: min_speed
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.summary_table.return }}

  - name: Round off min speed to 2 decimal_places
    id: round_min_speed
    task: round_off_values
    partial:
      dp: 2
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.calc_min_speed.return }}
      
  - name: Calculate max speed 
    id: calc_max_speed
    task: dataframe_column_sum
    partial:
      column_name: max_speed
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.summary_table.return }}

  - name: Round off max speed to 2 decimal_places
    id: round_max_speed
    task: round_off_values
    partial:
      dp: 2
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.calc_max_speed.return }}

  - name: Calculate total distance
    id: total_distance_covered
    task: dataframe_column_sum
    partial:
      column_name: total_distance
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.summary_table.return }}

  - name: Round off total distance to 2 decimal_places
    id: round_total_distance
    task: round_off_values
    partial:
      dp: 2
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.total_distance_covered.return }}

  - name: Create single value widgets for total mean speed per group
    id: total_mean_speed_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Mean Speed 
      decimal_places: 2
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.round_mean_speed.return }}

  - name: Merge per group mean speed SV widgets
    id: total_mean_speed_sv_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_mean_speed_widgets.return }}

  - name: Create single value Widgets for total min speed per group
    id: total_min_speed_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Min Speed 
      decimal_places: 2
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.round_min_speed.return }}

  - name: Merge per group min speed SV widgets
    id: total_min_speed_sv_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_min_speed_widgets.return }}

  - name: Create single value widgets for total max speed per group
    id: total_max_speed_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Max Speed 
      decimal_places: 2
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.round_max_speed.return }}

  - name: Merge per group max speed SV widgets
    id: total_max_speed_sv_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_max_speed_widgets.return }}

  - name: Create single value widgets for total distance per group
    id: total_distance_widgets
    task: create_single_value_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Distance covered
      decimal_places: 2
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.round_total_distance.return }}

  - name: Merge per group total distance SV widgets
    id: total_distance_sv_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.total_distance_widgets.return }}

  # #html to png 
  - name: Convert speedmap html to png
    id: convert_speed_png 
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1
    mapvalues:
      argnames: html_path
      argvalues: ${{ workflow.persist_speedmap_html.return }}

  - name: Convert tracks html to png
    id: convert_tracks_png 
    task: html_to_png
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1
    mapvalues:
      argnames: html_path
      argvalues: ${{ workflow.track_html_url.return }}

  - name: Convert line chart to png 
    id: convert_line_png 
    task: html_to_png
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config: 
        full_page: false 
        device_scale_factor: 2.0 
        wait_for_timeout: 10
        max_concurrent_pages: 1 
    mapvalues: 
      argnames: html_path 
      argvalues: ${{ workflow.persist_vehicle_chart.return }}

  # Download cover template
  - name: Download cover page template
    id: download_cover_page
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/huzg95h8p04a1wtgi9nbv/vehicles_cover_page.docx?rlkey=g3a7vi3ncesffww6mfafc9npn&st=jtn3m5jk&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      unzip: false
      retries: 2

  # Download section templates
  - name: Download section templates
    id: download_sect_templates
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/hk5gh4kd6uf2cl68dcaac/custom_vehicle_template.docx?rlkey=a2ior7pcmgcb3e8a1d7qchodb&st=wh94dfph&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      unzip: false
      retries: 2

  - name: Unique subjects on trajs 
    id: unique_subjects
    task: dataframe_column_nunique
    partial:
      df: ${{ workflow.traj_add_temporal_index.return }}
      column_name: groupby_col

  - name: Download org log path
    id: persist_logo
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/8oohb6i0kcj0q3qsud9l4/lion-guardians.png?rlkey=4kdqytux2qyftb5sgnaigyuyz&st=os6i6j6h&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Create cover template context 
    id: create_cover_tpl_context
    task: prepare_cover_metadata
    partial:
      org_logo_path: ${{ workflow.persist_logo.return }}
      report_period: ${{ workflow.time_range.return }}
      prepared_by: "Ecoscope"
      extra_fields:
        count: ${{ workflow.unique_subjects.return }}
      time_generated_format: "%Y-%m-%d %H:%M:%S"

  - name: Persist cover page 
    id: persist_vehicles_page
    task: create_context_page
    partial:
      template_path: ${{ workflow.download_cover_page.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      context: ${{ workflow.create_cover_tpl_context.return }}
      filename: cover_page.docx

  # Create vehicles report context
  - name: Group vehicles context values 
    id: group_context_values 
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial: 
      iterables:
        #- ${{ workflow.split_subject_traj_groups.return }} # df
        - ${{ workflow.persist_summary_table.return }} # summary_table
        - ${{ workflow.convert_speed_png.return }} # speedmap
        - ${{ workflow.convert_tracks_png.return }} # tracks
        - ${{ workflow.convert_line_png.return }} # line_chart

  - name: Create individual context
    id: build_vehicles_context
    task: ecoscope_workflows_ext_lion_guardians.tasks.reporting.create_vehicles_context
    mapvalues:
      argnames:
       # - df
        - summary_table
        - speedmap
        - tracks_map
        - line_chart 
      argvalues: ${{ workflow.group_context_values.return }}


  - name: Create grouper word doc
    id: create_grouper_doc
    task: ecoscope_workflows_ext_lion_guardians.tasks.reporting.render_docx_page
    partial:  
      template_path: ${{ workflow.download_sect_templates.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: null
      strict_images: true
      box_h_cm: 6.5
      box_w_cm: 11.11
    mapvalues:
      argnames: context 
      argvalues: ${{ workflow.build_vehicles_context.return }}

  - name: Merge cover page and individual collared documents
    id: merge_collared_docs
    skipif:
      conditions:
        - any_dependency_skipped
      unpack_depth: 1
    task: merge_docx_documents
    partial: 
      cover_page_path: ${{ workflow.persist_vehicles_page.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      context_page_items: ${{ workflow.create_grouper_doc.return }}
      filename: overall_report.docx
      order_by: name
      
  - name: Vehicles dashboard 
    id: vehicles_dashboard 
    task: gather_dashboard
    partial: 
      details: ${{ workflow.workflow_details.return }}
      widgets: 
        - ${{ workflow.total_mean_speed_sv_widget.return }} # mean speed widget
        - ${{ workflow.total_min_speed_sv_widget.return }} # min speed widget
        - ${{ workflow.total_max_speed_sv_widget.return }} # max speed widget
        - ${{ workflow.total_distance_sv_widget.return }} # total distance widget

        - ${{ workflow.merge_speedmap_widgets.return }}
        - ${{ workflow.merge_tracks_widgets.return }}
        - ${{ workflow.grouped_plot_widget_merge.return }}
        
      time_range: ${{ workflow.time_range.return }}
      groupers: ${{ workflow.groupers.return }}